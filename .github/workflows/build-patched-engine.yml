# GameBox v4.0 — shadPS4 渲染修复增强补丁 v2 引擎 CI 云端构建（v2.1 修复版）
#
# 用法（详见包内「先看我-GitHub云编译三步搞定.txt」）：
#   1. 把 .github / engine / build-engine 三个文件夹原样拖进一个 GitHub 仓库
#   2. Actions 页面 → build-patched-engine → Run workflow（手动触发）
#   3. 约 1~1.5 小时后在运行页 Artifacts 下载 shadPS4-415907b-patched-v2
#
# ─────────────────────────────────────────────────────────────────────
# v2.1 修复（2026-10-05）：解决「patch does not apply」10 个文件全失败
#
# 根因（已 1:1 复现确认）：
#   Windows runner 的 Git 默认 core.autocrlf=true，actions/checkout 检出仓库时
#   会把 engine/patches/*.patch（纯文本）的 LF 行尾自动转换成 CRLF——补丁每一
#   行末尾都多出一个 \r 字符，与源码（LF，来自 zip 原样解压）匹配时 10 个文件
#   全部失配，git apply 全军覆没。补丁本身与源码是完全匹配的（Linux 验证通过）。
#
# 修复（三道防线，缺一不可但相互独立）：
#   1) 检出后立即 git config --global core.autocrlf false（克隆子模块也用 LF）
#   2) 应用前把补丁文件行尾规范回 LF（幂等操作，本来就是 LF 则原样不动）
#   3) 用 --ignore-whitespace 应用——实测 LF/CRLF 四种组合全部通过
# ─────────────────────────────────────────────────────────────────────
#
# v2 相比 v1 工作流的关键修正：
#   - v1 误判"依赖已内置源码包"——实际 45 个 externals 子目录在 zip 里是空挂载点，
#     本版新增「恢复子模块」步骤：按 .gitmodules 从 GitHub 克隆 45 个依赖库
#     + 4 个嵌套依赖（zycore/SPIRV-Headers/dlg/rapidjson）。
#   - ffmpeg 预编译包按 git 短 SHA 命名下载，zip 源码无 git 历史；本版经
#     ffmpeg-cmake-sha-override.patch 支持 -DFFMPEG_GIT_SHA= 显式指定。
#   - ImGuiFileDialog 与 imgui 1.92.0-WIP 快照的 API 断裂由
#     imguifiledialog-childflags-compat.patch 修复（本地 Linux 全量编译验证通过）。
#   - 构建目标为 shadps4（SDL3 前端，源码 CMakeLists.txt add_executable(shadps4)）。
#
# 若 ffmpeg 下载 404（上游 release 变动），把下面 env 的 FFMPEG_SHA 换成
# 备选：b0de1dc 或 42557a7（均为已验证存在的 release）。

name: build-patched-engine

on:
  workflow_dispatch:
  push:
    tags: ['v*']

env:
  FFMPEG_SHA: 94dde08

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 初始化 Git 行尾配置（v2.1 修复：关掉 autocrlf）
        shell: bash
        run: |
          set -e
          # Windows runner 的 Git 默认 core.autocrlf=true：检出/克隆时会把文本
          # 文件的 LF 换成 CRLF。这会让补丁文件行尾被改坏（本次失败根因），
          # 也会让克隆下来的 45 个子模块源码行尾与 Linux 验证环境不一致。
          # 关掉它之后：补丁保持 LF、子模块克隆也是 LF，与本地验证环境一致。
          git config --global core.autocrlf false
          git config --global core.safecrlf false
          echo "[OK] core.autocrlf 已关闭"

      - name: 检查文件结构
        shell: pwsh
        run: |
          $missing = @()
          if (-not (Test-Path 'engine\patches')) { $missing += 'engine\patches（补丁文件夹）' }
          if (-not (Test-Path 'build-engine\source')) { $missing += 'build-engine\source（源码分卷文件夹）' }
          if ($missing) {
            Write-Host "[缺] 仓库根没找到：$($missing -join '、')"
            Write-Host '提示：要把 .github、engine、build-engine 三个文件夹原样放在仓库根（一起拖进上传框），不要只拖内层文件。'
            throw '文件结构不对'
          }
          Write-Host '[OK] 文件结构正确'

      - name: 合并源码分卷（如有）
        shell: pwsh
        run: |
          $dst = 'build-engine\source\shadps4-sifac4k-source.zip'
          if (Test-Path $dst) { Write-Host '[OK] 源码 zip 完整，无需合并'; exit 0 }
          $parts = Get-ChildItem 'build-engine\source' -Filter 'shadps4-sifac4k-source.zip.0*' | Sort-Object Name
          if (-not $parts) { throw "找不到 $dst（也没有分卷）—— source 文件夹是空的？" }
          $dstFull = Join-Path (Resolve-Path 'build-engine\source').Path 'shadps4-sifac4k-source.zip'
          $out = [System.IO.File]::Create($dstFull)
          foreach ($p in $parts) {
            $in = [System.IO.File]::OpenRead($p.FullName)
            $in.CopyTo($out)
            $in.Dispose()
          }
          $out.Dispose()
          Write-Host "[OK] 已合并 $($parts.Count) 个分卷 -> shadps4-sifac4k-source.zip"

      - name: 解压源码
        shell: pwsh
        run: |
          Expand-Archive -LiteralPath 'build-engine\source\shadps4-sifac4k-source.zip' -DestinationPath 'src' -Force
          if (-not (Test-Path 'src\shadps4-sifac4k-main\CMakeLists.txt')) { throw '解压后未找到 src\shadps4-sifac4k-main\CMakeLists.txt（源码包不完整）' }
          Write-Host '[OK] 源码解压完成'

      - name: 应用渲染修复主补丁（v2：10 文件 611 行，v2.1 防弹应用）
        shell: bash
        run: |
          set -e
          apply_patch() {
            local p="$1"
            # Git Bash 下把 Windows 风格路径转成 Unix 风格（更保险）
            command -v cygpath >/dev/null 2>&1 && p="$(cygpath -u "$p")"
            # 防线一：把补丁行尾规范为 LF。
            # Windows 检出时 autocrlf 可能把补丁的 LF 换成 CRLF（本次失败根因），
            # sed 幂等：本来就是 LF 则原样不动。
            if grep -q $'\r' "$p" 2>/dev/null; then
              sed -i 's/\r$//' "$p"
              echo "[FIX] 检测到 CRLF 行尾，已规范为 LF：$p"
            fi
            # 防线二：--ignore-whitespace 应用（LF/CRLF 任意组合实测全部通过）
            if git apply --check --ignore-whitespace "$p"; then
              git apply --ignore-whitespace "$p"
              echo "[OK] 补丁已应用：$(basename "$p")"
            else
              echo "[失败] 补丁内容与源码不匹配（这不是行尾问题，请截图日志）：$p"
              exit 1
            fi
          }
          cd src/shadps4-sifac4k-main
          git init -q 2>/dev/null || true
          apply_patch "$GITHUB_WORKSPACE/engine/patches/shadps4-gamebox-v2-combined.patch"
          grep -q 'PM4CmdSetPredication' src/video_core/amdgpu/pm4_cmds.h
          grep -q 'V_LOG_CLAMP_F32' src/shader_recompiler/frontend/translate/translate.h
          grep -q 'db_format_actual' src/video_core/renderer_vulkan/vk_rasterizer.h
          echo "[OK] 主补丁应用成功（条件渲染 + 流式输出 + D16S8 深度补偿 + clamp 纹理 + 着色器 clamp 指令）"

      - name: 恢复子模块（45 个外部依赖 + 4 个嵌套依赖）
        shell: bash
        run: |
          set -e
          cd src/shadps4-sifac4k-main
          mapfile -t NAMES < <(git config -f .gitmodules --get-regexp '^submodule\..*\.path$' | sed 's/^submodule\.\(.*\)\.path[[:space:]].*/\1/' | sort -u)
          echo "共 ${#NAMES[@]} 个子模块，开始克隆（8 路并行）……"
          restore_one() {
            local name="$1" path url branch
            path=$(git config -f .gitmodules --get "submodule.${name}.path")
            url=$(git config -f .gitmodules --get "submodule.${name}.url")
            branch=$(git config -f .gitmodules --get "submodule.${name}.branch" 2>/dev/null || true)
            [ -d "$path" ] && [ -n "$(ls -A "$path" 2>/dev/null)" ] && { echo "SKIP: $path"; return 0; }
            if [ -n "$branch" ]; then
              git clone -q --depth 1 --single-branch --branch "$branch" "$url" "$path"
            else
              git clone -q --depth 1 "$url" "$path"
            fi
            echo "OK: $path"
          }
          export -f restore_one
          printf '%s\n' "${NAMES[@]}" | xargs -P 8 -I{} bash -c 'restore_one "$@"' _ {}
          # 嵌套子依赖（zip 树不带 gitlink，需显式恢复；toml11 的 tests/docs 依赖构建不需要，跳过）
          clone_nested() {
            local path="$1" url="$2"
            if [ -d "$path" ] && [ -n "$(ls -A "$path" 2>/dev/null)" ]; then echo "SKIP: $path"; return 0; fi
            git clone -q --depth 1 "$url" "$path" && echo "OK(嵌套): $path"
          }
          clone_nested externals/zydis/dependencies/zycore https://github.com/zyantific/zycore-c.git
          clone_nested externals/sirit/externals/SPIRV-Headers https://github.com/KhronosGroup/SPIRV-Headers.git
          clone_nested externals/freetype/subprojects/dlg https://github.com/nyorain/dlg.git
          clone_nested externals/discord-rpc/thirdparty/rapidjson https://github.com/Tencent/rapidjson.git
          empty=$(for d in externals/*/; do [ -z "$(ls -A "$d" 2>/dev/null)" ] && echo "$d"; done | wc -l)
          [ "$empty" -eq 0 ] || { echo "仍有 $empty 个空目录"; exit 1; }
          echo "[OK] 全部子模块恢复完成"

      - name: 应用依赖构建补丁（ffmpeg SHA 覆盖 + IGFD 兼容，v2.1 防弹应用）
        shell: bash
        run: |
          set -e
          apply_patch() {
            local p="$1"
            command -v cygpath >/dev/null 2>&1 && p="$(cygpath -u "$p")"
            if grep -q $'\r' "$p" 2>/dev/null; then
              sed -i 's/\r$//' "$p"
              echo "[FIX] 检测到 CRLF 行尾，已规范为 LF：$p"
            fi
            if git apply --check --ignore-whitespace "$p"; then
              git apply --ignore-whitespace "$p"
              echo "[OK] 补丁已应用：$(basename "$p")"
            else
              echo "[失败] 补丁内容与子模块代码不匹配（这不是行尾问题，请截图日志）：$p"
              exit 1
            fi
          }
          cd src/shadps4-sifac4k-main
          apply_patch "$GITHUB_WORKSPACE/engine/patches/ffmpeg-cmake-sha-override.patch"
          apply_patch "$GITHUB_WORKSPACE/engine/patches/imguifiledialog-childflags-compat.patch"
          echo "[OK] 依赖构建补丁应用成功"

      - name: 初始化 MSVC 编译环境
        uses: ilammy/msvc-dev-cmd@v1

      - name: CMake 配置（MSVC + Ninja + Release + ffmpeg SHA）
        shell: pwsh
        run: |
          Set-Location 'src\shadps4-sifac4k-main'
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release "-DFFMPEG_GIT_SHA=$env:FFMPEG_SHA"

      - name: 编译（目标 shadps4）
        shell: pwsh
        run: |
          Set-Location 'src\shadps4-sifac4k-main'
          cmake --build build --target shadps4 --parallel

      - name: 收集产物
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifact | Out-Null
          $exe = Get-ChildItem -Path 'src\shadps4-sifac4k-main\build' -Recurse -Filter 'shadps4*.exe' | Select-Object -First 1
          if (-not $exe) { throw '未找到编译产物 shadps4.exe' }
          Copy-Item $exe.FullName 'artifact\shadPS4-415907b-patched-v2.exe'
          Copy-Item 'engine\patches\修复补丁说明-v2.md' 'artifact\' -ErrorAction SilentlyContinue
          Write-Host ("[OK] 产物：{0}（{1:N1} MB）" -f $exe.FullName, ($exe.Length/1MB))
          Get-ChildItem artifact

      - name: 上传 Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: shadPS4-415907b-patched-v2
          path: artifact/
          retention-days: 90
